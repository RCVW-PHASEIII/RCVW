name: rcvw
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "echo", "ruok", "|", "nc", "zookeeper", "2181" ]
    profiles:
      - rbs
      - vbs
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181

  kafka:
    image: confluentinc/cp-kafka:7.5.4
    restart: always
    healthcheck:
      test: [ "CMD", "kafka-cluster", "cluster-id", "-b", "kafka:9092" ]
    depends_on:
      zookeeper:
        condition: service_healthy
        required: true
    ports:
      - 29092:29092
    profiles:
      - rbs
      - vbs
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # The RCVW messaging service can be used by both the RBS and CBS components
  rabbitmq:
    image: rabbitmq
    profiles:
      - cbs-local

  cbs-sb:
    image: eucm/noop:latest
    profiles:
      - cbs

  cbs-local-sb:
    extends:
      service: cbs-sb
    depends_on:
      - rabbitmq
    profiles:
      - cbs-local

include:
  - path: ${RCVW_HOME:-.}/cbs/docker-compose.yaml
    project_directory: ${RCVW_HOME:-.}/cbs
  - path: ${RCVW_HOME:-.}/rbs/docker-compose.yaml
    project_directory: ${RCVW_HOME:-.}/rbs
  - path: ${RCVW_HOME:-.}/vbs/docker-compose.yaml
    project_directory: ${RCVW_HOME:-.}/vbs